---
# Group builders are responsible for handling groups
# Note that "group" and "user" is an abstraction and
# only really means something once the builders have resolved them
group_builders:
  # Groups are MANAGED OPA (oktapam) resources: ${NAME}_admin/${NAME}_user
  # groups, ${NAME}_rg delegated to ${NAME}_admin, and the user/admin policy
  # pair (PLAN.md local-migration). Users, by contrast, are read-only lookups.
  - name: oktagroups
    is_default: true
    type: okta-tf
    executable: open-tofu-1
    org: "noaa"
    team: "nos-coastal-modeling-cloud-sandbox"
    # Stage 56: CI logs in as a WORKLOAD. Both objects are the team's, made by
    # hand once in the OPA console (WORKLOAD_CONNECTION.md in cs-image-system);
    # with both named, every managed group gets a CI login policy beside its
    # user policy, kept by the identity lifecycle through the OPA API.
    workload_connection: "github-actions-infrastructurebuilder"
    workload_role: "cs-image-system-testconfig-ci"
    # stage 75: REQUIRED since 0.1.1.dev13 -- the posix group builder that makes
    # these groups exist on their machines: each applying instance run creates
    # the group with OPA's gid and its member list, and a PAM hook (baked, and
    # installed again by that run) adds each member at every login, because
    # OPA's agent makes accounts at a login and drops their groups when it
    # deletes them (seen on coops-model-005, 2026-10-03)
    posix: posix-local
    # key: "test-key"
    # secret: "test-secret"
    # stage 22.5 REMOVED -- a field on the USER builder, not the group builder; group-builders.yml uses it correctly further down under user_builders
    # default_user_email_template: "{{ this.name }}@{{ builder.email_domain }}"
    required_providers:
      - name: oktapam
        source: okta/oktapam
        version: '>= 0.6.3'
  # stage 75: the posix group builder oktagroups names as its `posix:` delegate;
  # no terraform root, no credentials. No group of its own here.
  - name: posix-local
    type: posix
# User builders handle users
user_builders:
  # okta-tf-ro: read-only. Emits only `data "okta_user"` lookups of existing
  # users -- never creates or modifies anything in Okta. Identities are made
  # by hand in the Okta admin UI (PLAN.md local-migration).
  - name: okta-tf-users
    is_default: true
    type: okta-tf-ro
    executable: open-tofu-1
    org: "noaa"
    team: "nos-coastal-modeling-cloud-sandbox"
    # user.name is the bare OPA username; email (explicit, or derived by this
    # template) is used ONLY for the org lookup (PLAN.md local-migration Q3).
    email_as_username: false
    # stage 51: the domain is its own value so it can be declared encrypted;
    # a derived address inherits it and reaches the emission as ciphertext,
    # which is what encrypting the names was meant to achieve and did not
    email_domain: ENC[age:]
    default_user_email_template: "{{ user.name }}@{{ builder.email_domain }}"
    # Lookup credentials come from OKTA_API_* env vars (see the credentials
    # runbook in PLAN.md), so no key/secret here.
    required_providers:
      - name: okta
        source: okta/okta
        version: '>= 6.0'
