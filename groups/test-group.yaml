---
# Note that every user must have a unique name, and that any user referenced in a group membership MUST have a corresponding user entry in the users section of this file.
# Any given user can be added to any given group at any location using any builder.
# Member/admin entries are BARE OPA usernames (PLAN.md local-migration Q3), not emails.

# Currently, you should not set a "type" on a user entry as the default user type is the only valid one ('okta-tf-ro', read-only)
groups:
  # Both of these groups use the default group-builder
  - name: basic
    is_root: true
    is_default: false
    description: "Root admin group with access to everything"
    admins:
      - ENC[age:]
    tags:
      environment: production
  - name: coops
    is_default: false
    description: "CO-Ops  group"
    members:
      # Mirrors live OPA coops_user (state query, 2026-08-31). Names MUST
      # match a corresponding user['name'] entry in SOME users section.
      - ENC[age:]
      - ENC[age:]
    admins:
      - ENC[age:]
      - ENC[age:]
    tags:
      environment: test
