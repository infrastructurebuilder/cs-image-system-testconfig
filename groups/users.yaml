users:
  # Names are the bare OPA usernames (PLAN.md local-migration Q3) — exactly what
  # oktapam_user_group_attachment and group members/admins lists use, matching
  # the OPA team's user list (verified 2026-08-21). Email is used ONLY to look
  # the user up in the parent Okta org: explicit `email:` when given, otherwise
  # derived from the builder's default_user_email_template (name@noaa.gov).
  # first_name/last_name are required data (never derived from 'name').
  - name: ENC[age:]
    first_name: ENC[age:]
    last_name: ENC[age:]
  - name: ENC[age:]  # exact OPA username casing
    first_name: ENC[age:]
    last_name: ENC[age:]
    email: ENC[age:]
