# stage 75 step 9 (operator, 2026-10-04): the standalone posix proof's group,
# RETIRED the same day -- its machine decommissioned, its two builds disposed,
# its proof user and image removed. The entry stays because a group the system
# once managed never leaves the configuration (DESIGN N19): gid 3101 stays
# claimed by this name. Unmanaged: no image owns it, no machine carries it, no
# run touches it.
groups:
  - name: pxproof
    type: posix-local
    gid: 3101
    unmanaged: true
    description: "{{ group.name }}: the retired standalone posix proof's group"
