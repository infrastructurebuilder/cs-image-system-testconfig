---
- name: Install an uncommon package on AlmaLinux 10
  hosts: all
  become: true

  tasks:
    - name: Enable EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install rig (RPM-based indexer/build tool, uncommon on AlmaLinux 10)
      ansible.builtin.dnf:
        name: figlet
        state: present
        enablerepo: epel

    - name: Verify installation
      ansible.builtin.command: figlet -v
      register: figlet_check
      changed_when: false

    - name: Show installed version
      ansible.builtin.debug:
        var: figlet_check.stdout

