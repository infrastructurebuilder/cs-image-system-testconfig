
images:
  - name: imgfile-basic-cloudflow
    group: coops # owning group (V2 Q4): identifies the identity type via the group's builder
    aliases:
      - some-basic-cloudflow
    # The default image is used as the base of other images for it's type 
    # and cloud provider.  The default image should not use a default vaue
    # for os or type, but may use the default for provider
    is_default: true
    # Tags have to be strings
    tags:
      cloudflow: "true"
    #os: rhel8
    # runtime: default
    type: default # from global config default-image-type
    auto_update: true
    source_image: imgfile-basic-dask
    description: '{{ ENV["USER"] }}''s Basic cloudflow head node with essential tools and configurations.'    
    runtimes: 
    - image_builder: pckr-ebs-ans
    - image_builder: some-other-builder
  - name: imgfile-basic-dask
    group: coops # owning group (V2 Q4): identifies the identity type via the group's builder
    runtimes:
      - image_builder: pckr-ebs-ans
      - image_builder: pckr-gce-ans # GCP readiness (2026-09-02)
        # bake size (finding 41): the dask mods OOM a 1-2 GB machine -- the
        # AWS lesson (t3.medium) in GCE form; e2-medium = 4 GB
        machine_type: e2-medium
        # source_image: imgfile-basic-cloudflow # Because it's the default
    tags:
      dask: "true"
    type: pckr-ebs-ans
    source_image: basic-rh-10 # renamed from basic-rhel-8 (2026-09-04)
    # convergent bakes (stage 9): a newer basic-rh-10 head re-bakes this image
    # from it in the same run and moves the parent pin (op: follow) -- the
    # explicit `upgrade image` step is no longer needed between the two bakes
    parent_policy: follow
    # stage 22.5 REMOVED -- valid inside a runtime subconfig (as above), not at image level, where no field accepts it
    # machine_type: t2.medium
    description: "Basic Dask head node with essential tools and configurations."
    tests:
      commands:
        - run: "git --version"
          contains: "git version"
      packages: [git]
      users: [csisadmin]
      # stage 14: post-bake tests run ON the launched (ephemeral) instance by
      # `verify instance`, recorded per build in meta-state/image-tests.yaml;
      # `release` refuses a build without a passing record
      post_bake:
        commands:
          - run: "python3 -c 'import dask'"
        files:
          - path: /var/lib/csis/launch-applied
        mounts: [/mnt/gce-data]
    # stage 14: a build whose post-bake tests pass is released for `default`
    # by the same run's release lifecycle (before retention, which keeps it)
    release:
      model: default
    modifications:
      - name: dask-setup-jeffy
        type: ansible-default
        playbooks:
          - setup_dask.yml
        config:
          dask_version: "2023.9.1AA"
          jupyterlab_extension: true
        # stage 22.5 REMOVED -- the same key nested under the mod item's config is read; this bare one sits on the item itself, which has no such field
        # dask_version: Suck it trebek
      # A shell modification (DESIGN 3M2): inline lines and/or script files
      # (config-root-relative), emitted as one packer provisioner "shell".
      - name: derivative-setup
        type: bash-remote
        script:
          - "echo 'derivative setup'"  # inline lines are literal shell (no templating; packer would also misread '{{')
          - "sudo mkdir -p /opt/derivative && echo 1.0.0 | sudo tee /opt/derivative/VERSION"
        scripts:
          - mod_image.sh
        # declarative, idempotent steps (guarded shell is generated)
        ensure:
          packages: [git]
          files:
            - path: /etc/derivative.conf
              content: "version=1.0.0\n"
              mode: "0644"
          commands:
            - run: "sudo mkdir -p /opt/derivative/data"
              unless: "test -d /opt/derivative/data"
        config:
          derivative_version: "1.0.0"
    # stage 22.5 REMOVED -- not a field anywhere in the system; a stray value that has always been discarded
    # jethro: bodine
  # ---------------------------------------------------------------- stage 19
  # The first image built for a model rather than for the system's own proof.
  # Derived from basic-rh-10 DIRECTLY (operator, 2026-09-19) rather than from
  # either existing coops image: its only modifications are the model's, at the
  # cost of repeating whatever imgfile-basic-dask already does.
  - name: imgfile-coops-model
    group: coops                  # owning group: its members get access through OPA
    type: pckr-ebs-ans
    source_image: basic-rh-10
    # a newer basic-rh-10 head re-bakes this image from it in the same run
    parent_policy: follow
    description: "CO-OPS model image: the group's working image on AWS."
    runtimes:
      - image_builder: pckr-ebs-ans
        # the bake host, not the instance: a 4xlarge is not needed to run dnf
        machine_type: t3.medium
    tests:
      # `packages` compiles to `rpm -q <name>`, which asks exactly what
      # `rpm -qa | grep` asks: does rpm know this package (operator, 2026-09-19)
      # `vim-enhanced`, not `vim` (operator, 2026-09-20): on AlmaLinux 10 there
      # is NO package named vim -- `dnf install vim` resolves a virtual provide
      # to vim-enhanced, so `rpm -q vim` can never succeed. The first build's
      # post-bake tests failed on exactly that.
      packages: [vim-enhanced, mpdecimal]
      commands:
        - run: "vim --version"
          contains: "VIM - Vi IMproved"
      users: [csisadmin]
      # stage 14: `release` refuses a build whose post-bake tests did not pass,
      # so the same proof runs again on the LAUNCHED instance -- an image that
      # only passes inside the bake has not been shown to boot
      post_bake:
        commands:
          - run: "rpm -q vim-enhanced mpdecimal"
          - run: "vim --version"
            contains: "VIM - Vi IMproved"
        mounts: [/mnt/data, /mnt/efs]
    release:
      model: coops
    modifications:
      - name: coops-model-packages
        type: bash-remote
        # declarative and idempotent: the generated shell guards each install,
        # so a re-bake over a newer parent is not a reinstall
        ensure:
          # amazon-efs-utils supplies mount.efs, without which the generated
          # fstab entry (efs type, tls, access point) cannot mount -- the first
          # build's EFS mount failed for exactly that. By the system's design
          # (N10) mount tooling belongs to the BASE image through its
          # `storage_types`; basic-rh-10 declares none, and no instance in this
          # tree had ever attached an EFS storage before this one.
          packages: [vim-enhanced, mpdecimal]
          commands:
            # amazon-efs-utils supplies mount.efs, without which the generated
            # fstab entry (efs type, tls, access point) cannot mount. It is NOT
            # in AlmaLinux's repositories -- `dnf install amazon-efs-utils`
            # answers "No match for argument", proven on a build 2026-09-20 --
            # because AWS ships it in the Amazon Linux repos only. Their
            # documented route for RHEL-family is to build the rpm from source.
            # The build tooling is removed afterwards so it does not ride along
            # in the image. rust/cargo are build requirements of efs-utils 2.x,
            # The 1.x line is pinned deliberately: efs-utils 2.x builds a
            # Rust watchdog whose crates need a newer rustc than AlmaLinux 10
            # packages ("Either upgrade rustc or cargo update", proven on a
            # build 2026-09-20). The remaining build requirements come from the
            # spec itself (`dnf builddep`) rather than from guessing them one
            # failed bake at a time.
            - run: >-
                sudo dnf -y install git make rpm-build 'dnf-command(builddep)' &&
                rm -rf /tmp/efs-utils &&
                git clone https://github.com/aws/efs-utils /tmp/efs-utils &&
                cd /tmp/efs-utils &&
                git checkout "$(git tag -l 'v1.*' --sort=-v:refname | head -1)" &&
                sudo dnf -y builddep ./amazon-efs-utils.spec &&
                make rpm &&
                sudo dnf -y install ./build/amazon-efs-utils*rpm &&
                (sudo dnf -y remove git make rpm-build || true) &&
                rm -rf /tmp/efs-utils
              unless: "rpm -q amazon-efs-utils"

  - name: imgfile-data-science
    group: stofs # owning group (V2 Q4): identifies the identity type via the group's builder
    aliases:
      - ds-node
    tags:
      data_science: "true"
    # stage 22.5 REMOVED -- the builder assigns this at load; valid on an OS base-image subconfig and as a runtime list entry (above), not at image level
    # image_builder: default
    source_image: my-deb-11
    description: "Data Science node with pre-installed libraries and tools."
    runtimes:
      - image_builder: pckr-ebs-ans
    modifications:
      - name: data-science-setup
        playbooks:
          - setup_data_science.yml
        config:
          python_version: "3.10"
          r_version: "4.2.1"