---
# V2 (DESIGN §3F2, rev 12): instances no longer declare groups -- the owning
# group lives on the instance IMAGE and every instance of that image shares it.
# Storage attachment stays per instance (N16); an attachment is legal only if
# the image's group is on the storage's allowed list (or the storage is
# public_read).
instances:
  # Declared ephemerality (stage 10.8, operator decision 2026-09-07): gce-test
  # is a REAL declaration that never persists -- every run that may apply the
  # GCE root launches it, verifies it (serial console + booted image + the pd
  # mount), and tears it down in the same run. A failed verification leaves
  # it standing for inspection and fails the run.
  - name: gce-test
    image: imgfile-basic-dask
    runtime: gcloud-east1
    type: tofu-gce
    description: "GCE verification instance (free-tier e2-micro); ephemeral"
    ephemeral: true
    storages:
      - name: gce_data
        mount_point: /mnt/gce-data
  # ---------------------------------------------------------------- stage 19
  # The first instance declared for a MODEL rather than for the system's own
  # proof. Operator decisions 2026-09-19: the coops group, a c5n.4xlarge, and
  # the two storages that already exist -- no new declarations.
  #
  # It STANDS: not ephemeral, so the group's members can log in whenever,
  # which is the half of the purpose an ephemeral instance cannot exercise.
  # It bills continuously (~$0.86/hour on demand, about $620 a month) plus the
  # 100 GiB volume and the EFS filesystem.
  #
  # No availability_zone here: the runtime's default subnet is east2-az1-private
  # (us-east-2a), which is where mnt_data's volume lives, and stage 52 refuses
  # the combination if that ever stops being true.
  # SHUT DOWN 2026-09-20 (operator) and commented out, not deleted: stage 19
  # is unfinished -- the image bakes and its tests enforce now, but no build is
  # RELEASED, and a declared instance pinned to an unreleased build makes
  # `require_released_builds` refuse every run, including the one that would
  # fix it. The same hazard the test/test2 note below describes. Its pin for
  # ami-0e209feedc49fa96c is still in meta-state/pins.yaml and will have to go
  # or be superseded before this is declared again.
  # ---------------------------------------------------------------- stage 19
  # The first instance declared for a MODEL rather than for the system's own
  # proof. Operator decisions 2026-09-19: the coops group, a c5n.4xlarge, and
  # the two storages that already exist -- no new declarations.
  #
  # It STANDS: not ephemeral, so the group's members can log in whenever,
  # which is the half of the purpose an ephemeral instance cannot exercise.
  # It bills continuously (~$0.86/hour on demand, about $620 a month) plus the
  # 100 GiB volume and the EFS filesystem.
  #
  # No availability_zone here: the runtime's default subnet is east2-az1-private
  # (us-east-2a), which is where mnt_data's volume lives, and stage 52 refuses
  # the combination if that ever stops being true.
  - name: coops-model
    machine_type: c5n.4xlarge
    image: imgfile-coops-model
    description: "CO-OPS model node: the group's standing working instance."
    tags:
      group: coops
      purpose: model
    storages:
      - name: mnt_data
        mount_point: /mnt/data
      - name: efs-storage
        mount_point: /mnt/efs
  # test/test2 (the stage-1 AWS t3.medium instances) commented out for now
  # (user decision 2026-09-05): they were torn down at the stage-1 close-out,
  # and a dormant declaration would relaunch both the next time
  # apply_instances flips. The test suite re-declares them for its own
  # config copies (tests/fixtures/test_instances.yaml via copy_config),
